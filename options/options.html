<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Intercom Chat Auditor Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Intercom Chat Auditor Settings</h1>
    
    <div class="form-group">
      <label for="apiKey">Gemini API Key:</label>
      <input type="password" id="apiKey" placeholder="Enter your Gemini API key">
      <small>Stored securely in your browser's local storage for direct, private communication with the Gemini API.</small>
    </div>
    
    <div class="form-group">
      <label for="model">Gemini Model:</label>
      <select id="model">
        <option value="gemini-3.5-flash">gemini-3.5-flash (Recommended: Ultra Fast & Accurate)</option>
        <option value="gemini-3.5-pro">gemini-3.5-pro (Deepest Reasoning: Slower)</option>
        <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (Cost-efficient)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="slaLimit">Target SLA Response Time (seconds):</label>
      <input type="number" id="slaLimit" value="60" min="10" max="600">
      <small>The maximum allowed duration (in seconds) for support agents to acknowledge a proctor's initial issue message.</small>
    </div>
    
    <button id="saveBtn">Save Auditor Settings</button>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
